# Builds, signs and publishes a release of a version tag:
#   git tag v0.3.0 origin/main && git push origin v0.3.0
#   then Actions → Release → Run workflow (tag: v0.3.0), or
#   gh workflow run release.yml -f tag=v0.3.0
# Servers find it through Admin → Updates. Tags with a suffix (v0.4.0-rc.1)
# become pre-releases, which servers do not update to.
#
# Releases start by hand on purpose: whoever can push a tag (including
# agents with a push token) must not be able to get a signed release. Only
# someone allowed to run workflows can, so keep "Actions", "Workflows" and
# "Secrets" permissions off the tokens agents use. The signing key is the
# repository secret COLLIE_SIGNING_KEY (`mise run release-key`).
#
# The tag is resolved once, in `check`; every later job stops unless the
# tag still points at that commit, so only it gets built and signed.
#
# The agent image's base (internal/sandbox/image/base/Containerfile) is
# published to GHCR as ghcr.io/<owner>/collie-agent-base:<hash of that
# file>. It is built only when that tag is missing, or when "rebuild_base"
# is ticked (to pick up Ubuntu updates). The release pins it by digest, so
# servers run exactly the base it was made with, whatever the tag points to
# later.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release (e.g. v0.3.0); it must be on main
        required: true
        type: string
      rebuild_base:
        description: Rebuild the agent base image even if one exists for this definition (picks up Ubuntu updates)
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  REBUILD_BASE: ${{ inputs.rebuild_base }}
  BASE_FILE: internal/sandbox/image/base/Containerfile

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }

      # Actions are pinned to commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Check the tag is on main
        run: git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main"; exit 1; }

      # Every later job checks the tag out again and stops unless it is
      # still this commit: a tag moved while the workflow runs must not get
      # built or signed.
      - id: sha
        name: Pin the commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The agent base image, natively on each architecture.
  base:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check the tag still points at the checked commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          got="$(git rev-parse HEAD)"
          [ "$got" = "$SHA" ] || { echo "$TAG moved to $got after it was checked ($SHA)"; exit 1; }

      - name: Build and push the base image (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/collie-agent-base:$(sha256sum "$BASE_FILE" | cut -c1-12)"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ "$REBUILD_BASE" != true ] && docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published"
            exit 0
          fi
          # BuildKit pushes the layers itself: `docker push` got "unknown
          # blob" from GHCR for the layer that came from docker.io.
          docker buildx create --use --driver docker-container >/dev/null
          for try in 1 2 3; do
            if docker buildx build --pull --push --provenance=false --sbom=false \
              --platform "linux/$ARCH" -f "$BASE_FILE" -t "$image-$ARCH" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              "$(dirname "$BASE_FILE")"; then
              exit 0
            fi
            echo "build or push failed (attempt $try)"
            sleep $((try * 15))
          done
          exit 1

  # Joins the architectures under one tag and hands its digest to the build.
  base-index:
    needs: [check, base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.index.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check the tag still points at the checked commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          got="$(git rev-parse HEAD)"
          [ "$got" = "$SHA" ] || { echo "$TAG moved to $got after it was checked ($SHA)"; exit 1; }

      - id: index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/collie-agent-base"
          image="$repo:$(sha256sum "$BASE_FILE" | cut -c1-12)"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ "$REBUILD_BASE" = true ] || ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$image" "$image-amd64" "$image-arm64"
          fi
          manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
          platforms="$(jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(" ")' <<<"$manifest")"
          [ "$platforms" = "linux/amd64 linux/arm64" ] || { echo "$image has platforms: $platforms"; exit 1; }
          digest="$(jq -r .digest <<<"$manifest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for $image: $digest"; exit 1; }
          echo "$image is $repo@$digest"
          echo "image=$repo@$digest" >> "$GITHUB_OUTPUT"

  # npm packages, tests and the build run here, without the signing key.
  build:
    needs: [check, base-index]
    runs-on: ubuntu-latest
    env:
      COLLIE_BASE_IMAGE: ${{ needs.base-index.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check the tag still points at the checked commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          got="$(git rev-parse HEAD)"
          [ "$got" = "$SHA" ] || { echo "$TAG moved to $got after it was checked ($SHA)"; exit 1; }

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Build
        run: COLLIE_VERSION="$TAG" mise run dist

      - name: Test
        run: mise run test

      - name: Check the version and the base image
        run: |
          got="$(./dist/collie-linux-amd64 --version)"
          [ "v$got" = "$TAG" ] || { echo "binary says $got, tag is $TAG"; exit 1; }
          for f in dist/collie-linux-*; do
            grep -qaF "$COLLIE_BASE_IMAGE" "$f" || { echo "$f does not pin $COLLIE_BASE_IMAGE"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Signs on a fresh runner and publishes.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check the tag still points at the checked commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          got="$(git rev-parse HEAD)"
          [ "$got" = "$SHA" ] || { echo "$TAG moved to $got after it was checked ($SHA)"; exit 1; }
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Check the tag still points at the checked commit (before signing)
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          got="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)"
          [ "$got" = "$SHA" ] || { echo "$TAG now points at ${got:-nothing}, not $SHA"; exit 1; }

      - name: Sign
        env:
          COLLIE_SIGNING_KEY: ${{ secrets.COLLIE_SIGNING_KEY }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          mise exec -- go run ./tools/release sign -tag "$TAG" dist/SHA256SUMS
          mise exec -- go run ./tools/release verify -tag "$TAG" dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          got="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)"
          [ "$got" = "$SHA" ] || { echo "$TAG now points at ${got:-nothing}, not $SHA"; exit 1; }
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG" $pre
