# Toolchain and build tasks. On a fresh server:
#   mise trust && mise install && mise run build
[tools]
go = "1.27.3"
node = "26.13.1"

[env]
CGO_ENABLED = "0"

[tasks.web]
description = "Build the web UI into web/dist"
dir = "{{config_root}}/web"
run = [
  "npm ci --no-audit --no-fund",
  "npm run build",
  "touch dist/.keep",
]

# Every build is stamped with its version, and release builds with their
# agent base image (tools/ldflags.sh).
[tasks.build]
description = "Build bin/collie (web UI embedded)"
depends = ["web"]
run = 'go build -trimpath -ldflags "$(./tools/ldflags.sh)" -o bin/collie .'

[tasks.cross]
description = "Cross-compile for another architecture or OS, e.g. `mise run cross arm64` (Linux) or `mise run cross darwin/arm64`"
depends = ["web"]
usage = 'arg "<arch>" help="GOARCH for Linux (amd64, arm64), or GOOS/GOARCH (darwin/arm64)"'
run = """
set -e
os=linux arch="${usage_arch}"
case "$arch" in */*) os="${arch%/*}" arch="${arch#*/}" ;; esac
GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$(./tools/ldflags.sh)" -o bin/collie-$os-$arch .
echo "built bin/collie-$os-$arch"
"""

[tasks.dist]
description = "Build the release files into dist/: binaries for linux amd64/arm64 and SHA256SUMS"
depends = ["web"]
run = """
set -e
v="$(./tools/version.sh)"
flags="$(./tools/ldflags.sh)"
rm -rf dist && mkdir dist
for arch in amd64 arm64; do
  GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$flags" -o dist/collie-linux-$arch .
done
cd dist && sha256sum collie-linux-* > SHA256SUMS
echo "built $v into dist/"
"""

[tasks.release-key]
description = "Create the release signing key: public half into internal/update/release.pub, private half into the repository secret COLLIE_SIGNING_KEY (gh needs permission to write secrets)"
usage = 'arg "[file]" help="where to also keep the private key" default="collie-release.key"'
run = """
set -e
key="${usage_file}"
go run ./tools/release keygen -out "$key"
gh secret set COLLIE_SIGNING_KEY < "$key"
echo
echo "Stored as the repository secret COLLIE_SIGNING_KEY. Commit internal/update/release.pub."
echo "Keep $key somewhere safe and offline (or delete it); never commit it."
"""

[tasks.test]
description = "Run Go tests, the frontend type check and the translation check"
run = [
  "go vet ./...",
  "go test ./...",
  "cd web && npx tsc --noEmit -p .",
  "cd web && node scripts/i18n-check.mjs",
]

[tasks.install]
description = "Build and install as a systemd user service (--domain NAME: HTTPS on the internet; --proxy URL, --serve, --funnel: see --help)"
depends = ["build"]
run = "./deploy/install.sh"

[tasks.dev]
description = "Run the API on :7878 without auth (pair with `cd web && npm run dev`)"
run = "go run . --no-auth --addr 127.0.0.1:7878"

[tasks.shots]
description = "Re-shoot the screenshots and demo GIF in docs/images, using a scripted stand-in for claude (needs Playwright + Chromium)"
depends = ["web"]
dir = "{{config_root}}/tools/demo"
run = [
  "npm ci --no-audit --no-fund",
  "node shoot.mjs",
]
